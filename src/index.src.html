:root{--bg:#F5F5F3;--card:#FFFFFF;--line:#E3E5E8;--line2:#EEF0F2;--tx:#1F2328;--mut:#5B636E;--acc:#2F3A4A;--nav:#1F2733;
--r:#C62828;--rbg:#FDECEA;--rtx:#A61B1B;--y:#D98A00;--ybg:#FFF2DB;--ytx:#7A4A00;--g:#2E7D32;--gbg:#E8F2EA;--gtx:#22582B}

label.f{font-size:12px;color:var(--mut)}
select,input[type=text],input[type=number],input[type=date],input:not([type]){font:inherit;font-size:13px;padding:7px 10px;border:1px solid #D5D9DE;border-radius:8px;background:#fff;color:var(--tx)}
input.num{width:76px;text-align:right;padding:4px 6px;border-radius:6px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:#FAFAF9;white-space:nowrap}
td{font-size:13px;padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
td.r,th.r{text-align:right}td.c,th.c{text-align:center}
tr.click{cursor:pointer}tr.click:hover td{background:#F7F8FA}

.tag.gray{background:#EEF0F2;color:var(--mut)}
.bar{height:8px;background:var(--line2);border-radius:4px;margin-top:5px}.bar>div{height:8px;background:var(--acc);border-radius:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}

dl.kv{margin:0;display:grid;grid-template-columns:1fr auto;gap:9px 12px;font-size:13px}dl.kv dt{color:var(--mut)}dl.kv dd{margin:0;font-weight:600;text-align:right}
.note{padding:10px 12px;border-radius:8px;background:var(--bg);font-size:13px}

td.zero{background:var(--rbg);color:var(--rtx);font-weight:700}td.ocd{box-shadow:inset 0 -3px 0 var(--acc)}

#toast{position:fixed;right:20px;bottom:20px;background:var(--nav);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;display:none;max-width:420px;z-index:9}
.grid2{display:grid;grid-template-columns:1fr 110px 110px;gap:10px 14px;align-items:center;font-size:13px}

@media (max-width:700px){#nav{max-width:none;flex-basis:100%}#main{padding:20px 16px}}

<script>/*__CORE__*/</script>
<script>
'use strict';
const VERSION = 'V.7';
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n, d = 0) => n == null || isNaN(n) ? '—' : Number(n).toLocaleString('es-GT', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n, d = 0) => n == null || isNaN(n) ? '—' : fmt(n * 100, d) + '%';
const fdate = s => { if (!s) return '—'; const d = Core.parseISO(s); return Core.DIA[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1); };
const wkTxt = L => { const w = Core.weekByLabel(L, S.params.fyOverrides); return 'S' + String(L % 100).padStart(2, '0') + ' (' + w.start.getDate() + '/' + (w.start.getMonth() + 1) + ')'; };
const SRC = ['Venta Semanal', 'Devoluciones', 'Instock', 'FCST', 'RTL'];
const KIND_TXT = { venta: 'Venta semanal', devoluciones: 'Devoluciones', instock: 'Instock 35 días', fcst: 'FCST', dss: 'RTL / DSS', fr: 'Fill Rate' };
const ESTADO_TXT = { rojo: '● Rojo', amarillo: '▲ Amarillo', verde: '✓ Verde' };

const S = {
  dir: null, frDir: null, params: Core.defaultParams(), data: null, A: null, view: 'resumen',
  filt: { canal: '', vendedor: '', formato: '', clave: '', estado: '', motivo: '', q: '', mant: false }, page: 1, sortKey: '',
  detKey: null, ocEdits: {}, ocExtra: [], fcEdits: {}, ocTab: '37', ocCediDate: '', paramTab: 'general', fcMot: null, trackOpen: null,
  log: [], status: {}, solicitudes: [], track: [], cmpFreq: [], frSum: null, frWeek: null, chart: null
};
try { const d = JSON.parse(localStorage.getItem('ad_borrador') || '{}'); S.ocEdits = d.ocEdits || {}; S.ocExtra = d.ocExtra || []; S.fcEdits = d.fcEdits || {}; } catch (e) { }
const saveDraft = () => { try { localStorage.setItem('ad_borrador', JSON.stringify({ ocEdits: S.ocEdits, ocExtra: S.ocExtra, fcEdits: S.fcEdits })); } catch (e) { } };

function toast(msg, ms = 3500) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', ms); }
function busy(on, txt) { const b = $('#busy'); b.textContent = txt || 'Procesando…'; b.style.display = on ? 'flex' : 'none'; }
function log(m) { S.log.push(new Date().toLocaleTimeString() + '  ' + m); }

/* ---------- IndexedDB: guarda los accesos a carpetas ---------- */
const idb = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('analisis-desviaciones', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { const db = await this.open(); return new Promise(res => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }); },
  async set(k, v) { const db = await this.open(); return new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); }); }
};

/* ---------- archivos ---------- */
async function sub(dir, name, create) { try { return await dir.getDirectoryHandle(name, { create: !!create }); } catch (e) { return null; } }
async function subPath(dir, path, create) { let d = dir; for (const p of path.split('/').filter(Boolean)) { d = await sub(d, p, create); if (!d) return null; } return d; }
async function readJSON(dir, path) {
  const parts = path.split('/'); const name = parts.pop(); const d = await subPath(dir, parts.join('/'), false); if (!d) return null;
  try { const f = await (await d.getFileHandle(name)).getFile(); return JSON.parse(await f.text()); } catch (e) { return null; }
}
async function writeFile(dir, path, data) {
  const parts = path.split('/'); const name = parts.pop(); const d = await subPath(dir, parts.join('/'), true);
  const fh = await d.getFileHandle(name, { create: true }); const w = await fh.createWritable(); await w.write(data); await w.close();
}
const writeJSON = (dir, path, obj) => writeFile(dir, path, JSON.stringify(obj));
async function entries(dir) { const out = []; if (!dir) return out; for await (const [n, h] of dir.entries()) out.push([n, h]); return out; }
async function xlsxFiles(dir) { return (await entries(dir)).filter(([n, h]) => h.kind === 'file' && /\.xls[xm]?$/i.test(n) && !n.startsWith('~$')).map(x => x[1]); }
async function jsonNames(dir) { return (await entries(dir)).filter(([n, h]) => h.kind === 'file' && n.endsWith('.json')).map(x => x[0]).sort(); }
async function readBook(fh) { const f = await fh.getFile(); const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' }); return { wb, file: f }; }
const sheetRows = (wb, name) => { const ws = wb.Sheets[name || wb.SheetNames[0]]; return ws ? XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null }) : null; };

/* ---------- conexión de carpetas ---------- */
const fsOK = 'showDirectoryPicker' in window;
async function verify(h, mode) { if (!h) return false; const o = { mode }; if ((await h.queryPermission(o)) === 'granted') return true; return (await h.requestPermission(o)) === 'granted'; }
async function connectProject() {
  try {
    const h = await window.showDirectoryPicker({ id: 'proyecto', mode: 'readwrite' });
    const names = (await entries(h)).map(x => x[0]);
    if (!names.includes('FCST') && !names.includes('Venta Semanal')) toast('Ojo: esta carpeta no tiene las subcarpetas FCST / Venta Semanal. Elige "IA Analisis Desviaciones".', 6000);
    S.dir = h; await idb.set('dir', h); await actualizar(false);
  } catch (e) { if (e.name !== 'AbortError') toast('No se pudo abrir la carpeta: ' + e.message); }
}
async function connectFr() {
  try { const h = await window.showDirectoryPicker({ id: 'fillrate', mode: 'read' }); S.frDir = h; await idb.set('frDir', h); await actualizar(false); }
  catch (e) { if (e.name !== 'AbortError') toast('No se pudo abrir la carpeta: ' + e.message); }
}
async function reopen() {
  const ok1 = await verify(S.dir, 'readwrite'); if (S.frDir) await verify(S.frDir, 'read');
  if (ok1) await actualizar(false); else toast('Sin permiso para la carpeta del proyecto.');
}

/* ---------- carga y proceso ---------- */
function mergeParams(p) {
  const d = Core.defaultParams(); if (!p) return d;
  const out = Object.assign({}, d, p);
  out.general = Object.assign({}, d.general, p.general || {});
  for (const k of ['frObj', 'diasInv', 'leadTime', 'diasSeguridad']) out.general[k] = Object.assign({}, d.general[k], (p.general || {})[k] || {});
  out.vendor = Object.assign({}, d.vendor, p.vendor || {});
  out.formato = Object.assign({}, d.formato, p.formato || {});
  out.poEvents = Object.assign({}, d.poEvents, p.poEvents || {});
  return out;
}
async function actualizar(force) {
  if (!S.dir) { render(); return; }
  busy(true, 'Leyendo carpetas…'); S.log = [];
  try {
    const datos = await sub(S.dir, '_datos', true);
    S.params = mergeParams(await readJSON(datos, 'parametros.json'));
    const ov = S.params.fyOverrides;
    let proc = force ? {} : (await readJSON(datos, 'procesados.json') || {});
    /* maestros */
    const masters = { items: {}, stores: {}, freq: {} };
    const xy = await sub(S.dir, 'Excel YF');
    const dit = (await xlsxFiles(xy)).filter(h => /data item/i.test(h.name));
    if (dit.length) {
      const { wb } = await readBook(dit[0]);
      const parsed = Core.parseItemData(sheetRows(wb, wb.SheetNames.find(n => /item/i.test(n))) || []);
      for (const k in parsed) {
        const cur = S.params.items[k];
        if (!cur) S.params.items[k] = Object.assign(parsed[k], { vida: null });
        else { if (!cur.itemD) cur.itemD = parsed[k].itemD; if (!cur.itemC) cur.itemC = parsed[k].itemC; }
      }
      masters.stores = Core.parseStrData(sheetRows(wb, wb.SheetNames.find(n => /str/i.test(n))) || []);
      log('Maestro de items y tiendas: ' + dit[0].name + ' · ' + Object.keys(parsed).length + ' claves, ' + Object.keys(masters.stores).length + ' tiendas');
    } else log('⚠ No encontré "Data Item y Tienda" en Excel YF');
    masters.items = S.params.items;
    const fqd = await sub(S.dir, 'Frecuencias');
    const fqFiles = []; for (const h of await xlsxFiles(fqd)) fqFiles.push({ h, f: await h.getFile() });
    fqFiles.sort((a, b) => b.f.lastModified - a.f.lastModified);
    if (fqFiles.length) { const { wb } = await readBook(fqFiles[0].h); masters.freq = Core.parseFrecuencias(sheetRows(wb)); log('Frecuencias: ' + fqFiles[0].h.name + ' · ' + Object.keys(masters.freq).length + ' tiendas'); S.status.freq = { name: fqFiles[0].h.name, date: fqFiles[0].f.lastModified }; }
    else log('⚠ No hay archivo en la carpeta Frecuencias');
    /* reportes Retail Link */
    let nuevos = 0;
    for (const folder of SRC) {
      const d = await sub(S.dir, folder);
      if (!d) { log('⚠ Falta la carpeta ' + folder); continue; }
      for (const h of await xlsxFiles(d)) {
        const f = await h.getFile(); const key = folder + '/' + h.name + '|' + f.size + '|' + f.lastModified;
        if (proc[key]) continue;
        busy(true, 'Leyendo ' + h.name + '…');
        let rows;
        try { const { wb } = await readBook(h); rows = sheetRows(wb); } catch (e) { log('✗ ' + h.name + ': no se pudo leer (' + e.message + ')'); continue; }
        const kind = Core.detectReport(rows);
        let info = null;
        if (kind === 'venta') { const p = Core.parseVenta(rows, ov); await writeJSON(datos, 'venta/' + p.week + '.json', p); info = 'semana ' + p.week; }
        else if (kind === 'devoluciones') { const p = Core.parseDevoluciones(rows, ov); await writeJSON(datos, 'devoluciones/' + p.week + '.json', p); info = 'semana ' + p.week; }
        else if (kind === 'instock') { const p = Core.parseInstock(rows); await writeJSON(datos, 'instock/' + stamp(p.requested) + '.json', p); info = p.desde + ' a ' + p.hasta; }
        else if (kind === 'fcst') { const p = Core.parseFcst(rows, ov); await writeJSON(datos, 'fcst/' + stamp(p.requested) + '.json', p); info = 'solicitado ' + new Date(p.requested).toLocaleString(); }
        else if (kind === 'dss') { const p = Core.parseDss(rows); await writeJSON(datos, 'dss/' + stamp(p.requested) + '.json', p); info = p.rows.length + ' combinaciones'; }
        else { log('⚠ ' + folder + '/' + h.name + ': no reconozco el reporte'); proc[key] = { kind: null }; continue; }
        proc[key] = { kind, info, at: Date.now() }; nuevos++;
        log('✓ ' + KIND_TXT[kind] + ' · ' + h.name + ' · ' + info);
      }
    }
    /* Fill Rate */
    const cur = Core.weekInfo(new Date(), ov).label;
    const need = []; for (let n = 1; n <= 6; n++) need.push(Core.weekAdd(cur, -n, ov));
    if (S.frDir) {
      const ok = (await S.frDir.queryPermission({ mode: 'read' })) === 'granted';
      if (ok) {
        const have = new Set((await jsonNames(await sub(datos, 'fr2', true))).map(n => +n.replace('.json', '')));
        const cands = [];
        const scan = async (d) => { for (const [n, h] of await entries(d)) { if (h.kind === 'directory' && /^\d{4}$/.test(n)) await scan(h); else if (h.kind === 'file') { const m = n.match(/^FR SMW (\d{6}) Combinacion\.xlsx$/i); if (m) cands.push([+m[1], h]); } } };
        await scan(S.frDir);
        for (const [L, h] of cands) {
          if (!need.includes(L) || (have.has(L) && !force)) continue;
          busy(true, 'Leyendo Fill Rate ' + L + '…');
          try { const { wb } = await readBook(h); const p = Core.parseFr(sheetRows(wb, 'DSS') || [], L, S.params); await writeJSON(datos, 'fr2/' + L + '.json', p); log('✓ Fill Rate semana ' + L); nuevos++; }
          catch (e) { log('✗ Fill Rate ' + L + ': ' + e.message); }
        }
      } else log('⚠ Falta permiso para la carpeta de Fill Rate (usa "Reabrir carpetas")');
    } else log('⚠ Carpeta de Fill Rate no conectada');
    await writeJSON(datos, 'procesados.json', proc);
    /* historia guardada */
    busy(true, 'Calculando…');
    const load = async (folder, n, numeric) => { const d = await sub(datos, folder, true); const names = await jsonNames(d); const pick = names.slice(-n); const out = []; for (const nm of pick) { const j = await readJSON(d, nm); if (j) out.push([nm.replace('.json', ''), j]); } return out; };

/* Resumen para la tarjeta de Desviaciones en el Centro de Control: Fill Rate
   de la última semana contra el objetivo (y la anterior, para la flecha),
   combinaciones con alerta con las 3 más urgentes, OC manuales que hacen
   falta, venta vs FCST de la última semana y el próximo evento. Se deja en
   localStorage —el centro sirve esta app desde su mismo sitio y lo lee
   directo— y se avisa al centro por postMessage. */
function publicarResumen() {
  try {
    const A = S.A; if (!A) return;
    const G = S.params.general;
    const frDe = (sum, t) => { const x = (sum || []).find(o => o.t === t && o.cls === 'auto'); return x && x.ord ? x.rec / x.ord : null; };
    const frL = Object.keys(S.data.fr).map(Number).sort((a, b) => b - a);
    const ant = frL[1] ? Core.frSummary(S.data.fr[frL[1]], S.params) : null;
    const fill = [[37, 'Directas'], [33, 'CEDI']].map(([t, nombre]) => ({ nombre, valor: frDe(S.frSum, t), anterior: frDe(ant, t), objetivo: G.frObj[t] / 100 }));
    const alertas = A.combos.filter(c => c.estado !== 'verde');
    const rojos = alertas.filter(c => c.estado === 'rojo');
    const lw = A.ventaWeeks[0]; let vt = 0, ft = 0;
    if (lw) for (const c of A.combos) { const h = c.hist.find(x => x.label === lw); if (h) { vt += h.pos; if (h.fcst != null) ft += h.fcst; } }
    let evento = null;
    for (let i = 0; i < 8 && !evento; i++) { const Lb = Core.weekAdd(A.week, i, S.params.fyOverrides); const u = Core.weekUplift(Lb, S.params.eventos, S.params.fyOverrides); if (u.pct > 0) evento = { semana: Lb, nombres: u.nombres, pct: u.pct }; }
    const msg = { v: 1, app: 'desviaciones', actualizado: new Date().toISOString(), datos: {
      semana: A.week, frSemana: S.frWeek, fill,
      alertas: { total: alertas.length, rojo: rojos.length, amarillo: alertas.filter(c => c.estado === 'amarillo').length,
        top: alertas.slice(0, 3).map(c => ({ estado: c.estado, tienda: c.s, nombre: c.name || '', clave: c.clave, riesgo: c.lostPost || c.lost7 || 0, motivo: c.motivo || '' })) },
      ocManuales: { combinaciones: rojos.length, unidades: rojos.reduce((a, c) => a + (c.lostPost || 0), 0) },
      ventaFcst: lw ? { semana: lw, venta: vt, fcst: ft || null } : null,
      evento } };
    localStorage.setItem('cc.insight.desviaciones', JSON.stringify(msg));
    if (window.parent !== window) window.parent.postMessage({ tipo: 'cc:insight', id: 'desviaciones', insight: msg }, '*');

}

  if (act === 'connect') return connectProject();
  if (act === 'connectFr') return connectFr();
  if (act === 'reopen') return reopen();

  if (act === 'fmant') { S.filt.mant = true; S.filt.estado = ''; S.page = 1; render(); return; }
  if (act === 'nav') { const { c, L } = curDet(); const i = L.findIndex(x => x.key === c.key) + (+a.dataset.d); if (L[i]) { S.detKey = L[i].key; render(); } return; }
  if (act === 'ocToggle') { const k = a.dataset.k, c = S.A.combos.find(x => x.key === k);
    if (c.estado === 'rojo') { const e2 = S.ocEdits[k] || (S.ocEdits[k] = {}); e2.incl = e2.incl === false; }
    else { const i = S.ocExtra.findIndex(x => x.key === k); if (i >= 0) S.ocExtra.splice(i, 1); else S.ocExtra.push({ key: k }); }
    saveDraft(); render(); toast('OC manual actualizada'); return; }
  if (act === 'fcMotAll') { S.fcMot = null; render(); return; }
  if (act === 'fcMotNone') { S.fcMot = []; render(); return; }
  if (act === 'fcToggle') { const k = a.dataset.k, e2 = S.fcEdits[k] || (S.fcEdits[k] = {}); e2.incl = e2.incl === false; saveDraft(); render(); return; }
  if (act === 'ocReset') { if (confirm('Quitar todos los cambios manuales de las OC?')) { S.ocEdits = {}; S.ocExtra = []; saveDraft(); render(); } return; }
  if (act === 'ocExport') { busy(true, 'Exportando…'); try { await exportOC(); } catch (er) { toast('Error al exportar: ' + er.message, 6000); } busy(false); return; }
  if (act === 'fcExport') { busy(true, 'Exportando…'); try { await exportFcst(); } catch (er) { toast('Error al exportar: ' + er.message, 6000); } busy(false); return; }
  if (act === 'saveParams') { busy(true, 'Recalculando…'); await saveParams(false); busy(false); return; }
  if (act === 'addItem') { const k = (prompt('Clave del nuevo item (ej. 5HM4):') || '').trim().toUpperCase(); if (!k) return; if (S.params.items[k]) return toast('Esa clave ya existe'); S.params.items[k] = { clave: k, cid: null, ean: '', desc: '', itemD: null, itemC: null, seqC: null, codigoOC: k.replace(/^\d+(?=[A-Z])/, ''), descOC: '', vida: null, vnpk: 1, activo: true }; render(); return; }
  if (act === 'delItem') { if (confirm('Eliminar la clave ' + a.dataset.k + '? Sus combinaciones dejarán de analizarse.')) { delete S.params.items[a.dataset.k]; render(); } return; }
  if (act === 'addEv') { S.params.eventos.push({ id: 'ev' + Date.now(), nombre: 'Nuevo evento', tipo: 'fecha', mes: 1, dia: 1, pct: 10, activo: true }); render(); return; }
  if (act === 'delEv') { S.params.eventos.splice(+a.dataset.i, 1); render(); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter') { const r = e.target.closest('tr[data-det]'); if (r) { S.detKey = r.dataset.det; S.view = 'detalle'; render(); } } });
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.filt) { S.filt[el.dataset.filt] = el.type === 'checkbox' ? el.checked : el.value; S.page = 1; render(); return; }
  if (el.dataset.act === 'goto') { S.detKey = el.value; render(); return; }
  if (el.dataset.act === 'cediDate') { S.ocCediDate = el.value; render(); return; }
  if (el.dataset.ocIncl) { const k = el.dataset.ocIncl, c = S.A.combos.find(x => x.key === k); if (c.estado === 'rojo') (S.ocEdits[k] || (S.ocEdits[k] = {})).incl = el.checked; else if (!el.checked) S.ocExtra = S.ocExtra.filter(x => x.key !== k); saveDraft(); render(); return; }
  if (el.dataset.ocQty) { (S.ocEdits[el.dataset.ocQty] || (S.ocEdits[el.dataset.ocQty] = {})).qty = Math.max(0, +el.value || 0); saveDraft(); render(); return; }
  if (el.dataset.ocCancel) { (S.ocEdits[el.dataset.ocCancel] || (S.ocEdits[el.dataset.ocCancel] = {})).cancel = el.value; saveDraft(); return; }
  if (el.dataset.fcMot != null) {
    const all = Array.from(new Set(fcLines().map(l => l.c.motivo)));
    let cur = S.fcMot ? S.fcMot.slice() : all.slice(); const m = el.dataset.fcMot;
    cur = el.checked ? Array.from(new Set(cur.concat(m))) : cur.filter(x => x !== m);
    S.fcMot = all.every(x => cur.includes(x)) ? null : cur; render(); return;
  }
  if (el.dataset.fcIncl) { (S.fcEdits[el.dataset.fcIncl] || (S.fcEdits[el.dataset.fcIncl] = {})).incl = el.checked; saveDraft(); render(); return; }
  if (el.dataset.fcBase) { (S.fcEdits[el.dataset.fcBase] || (S.fcEdits[el.dataset.fcBase] = {})).base = Math.max(0, +el.value || 0); saveDraft(); render(); return; }
  if (el.dataset.p) {
    let val = el.type === 'checkbox' ? el.checked : el.value;
    if (!el.dataset.txt && el.type !== 'checkbox') val = el.value === '' ? null : +el.value;
    if (el.tagName === 'SELECT' && !el.dataset.txt) val = el.value === '' ? null : +el.value;
    if (el.dataset.hex) val = String(val).replace('#', '').toUpperCase();
    if (el.dataset.p.startsWith('fyOverrides.') && !val) { delete S.params.fyOverrides[el.dataset.p.split('.')[1]]; return; }
    setPath(S.params, el.dataset.p, val);
    if (el.dataset.p.startsWith('formato.')) render();
  }
});
document.addEventListener('input', e => { if (e.target.dataset.filt === 'q') { clearTimeout(S.qh); const el = e.target; S.qh = setTimeout(() => { S.filt.q = el.value; S.page = 1; render(); const n = document.querySelector('[data-filt=q]'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 350); } });

/* ---------- app instalable ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#install').hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; $('#install').hidden = true; toast('App instalada'); });
$('#install').addEventListener('click', async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#install').hidden = true; });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });

/* ---------- inicio ---------- */
(async function init() {
  render();
  if (!fsOK) return;
  try {
    S.dir = await idb.get('dir'); S.frDir = await idb.get('frDir');
    if (S.dir && (await S.dir.queryPermission({ mode: 'readwrite' })) === 'granted') await actualizar(false);
    else render();
  } catch (e) { render(); }
})();
</script>
